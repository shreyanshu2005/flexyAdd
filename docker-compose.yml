services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-secret-key}
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: finance_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SETUP_TOKEN: ${SETUP_TOKEN:-mysetuptoken123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py setup_admin --email $$ADMIN_EMAIL --password $$ADMIN_PASSWORD --skip-if-exists &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120"

volumes:
  pgdata:
